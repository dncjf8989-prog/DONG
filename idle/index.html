<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>메이플 키우기 (프로토타입)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <div><b id="lv">Lv.1</b> <span id="job">모험가</span></div>
    <div>💰 <span id="meso">0</span> · 💎 <span id="gem">0</span> · 💠 <span id="rs">0</span></div>
  </header>

  <section id="stage">
    <div id="mapname"></div>
    <div id="field">
      <div id="mateview"></div>
      <div id="petview"></div>
      <div id="player">🧙<div class="bar"><i id="phpbar"></i></div></div>
      <div id="monster">👾<div class="bar"><i id="mhpbar"></i></div><small id="mname"></small></div>
      <div id="floaters"></div>
    </div>
    <div class="bar big"><i id="expbar"></i><span id="exptext"></span></div>
    <div id="expinfo"></div>
    <div id="stageinfo"></div>
    <div id="maps"></div>
    <div id="stages"></div>
  </section>

  <nav>
    <button data-tab="stats" class="on">능력치</button>
    <button data-tab="job">직업</button>
    <button data-tab="skill">스킬</button>
    <button data-tab="gear">장비</button>
    <button data-tab="mate">동료</button>
    <button data-tab="pet">펫</button>
    <button data-tab="gacha">뽑기</button>
    <button data-tab="tower">탑</button>
    <button data-tab="relic">유물</button>
    <button data-tab="reward">보상</button>
  </nav>
  <section id="tab"></section>
  <footer><button id="save">저장</button> <button id="reset">초기화</button> <button id="stealth">위장 모드</button> <span id="msg"></span></footer>
</div>
<div id="cover" hidden>
  <div class="cbar">문서1 - 편집기</div>
  <div class="cpage"><h2>3분기 업무 보고 (초안)</h2>
  <p>1. 추진 현황: 주요 과제 일정에 맞춰 진행 중이며 세부 항목은 아래와 같음.</p>
  <table><tr><th>항목</th><th>담당</th><th>진행률</th></tr>
  <tr><td>자료 취합</td><td>기획팀</td><td>80%</td></tr>
  <tr><td>예산 검토</td><td>재무팀</td><td>55%</td></tr>
  <tr><td>결과 정리</td><td>운영팀</td><td>30%</td></tr></table>
  <p>2. 향후 계획: 다음 주 중 검토 후 최종본 배포 예정.</p></div>
</div>
<script src="game.js"></script>
</body>
</html>
