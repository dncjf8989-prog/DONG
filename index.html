<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>마나 듀얼 - 카드 대전 초안</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400;1,500&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
</head>
<body>
<div id="app">
  <header id="top-bar">
    <h1>마나 듀얼</h1>
    <div class="sub">AI 또는 친구와 함께하는 카드 결투</div>
  </header>

  <div class="table">
    <div class="corner-gem corner-tl" aria-hidden="true"></div>
    <div class="corner-gem corner-tr" aria-hidden="true"></div>
    <div class="corner-gem corner-bl" aria-hidden="true"></div>
    <div class="corner-gem corner-br" aria-hidden="true"></div>
    <div class="felt">
      <div class="felt-scene" aria-hidden="true">
        <svg viewBox="0 0 1000 620" preserveAspectRatio="none">
          <defs>
            <linearGradient id="scnSky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#161022"/>
              <stop offset="30%" stop-color="#2e2140"/>
              <stop offset="58%" stop-color="#5c3f4a"/>
              <stop offset="78%" stop-color="#9a6a3f"/>
              <stop offset="100%" stop-color="#dcb35f"/>
            </linearGradient>
            <radialGradient id="scnMoonGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.9"/>
              <stop offset="35%" stop-color="#f3ca6c" stop-opacity="0.45"/>
              <stop offset="100%" stop-color="#f3ca6c" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="scnMoonBody" cx="38%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#fffdf2"/>
              <stop offset="70%" stop-color="#f3e7c0"/>
              <stop offset="100%" stop-color="#d8c68a"/>
            </radialGradient>
            <linearGradient id="scnFarMtn" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#5c4a5c"/>
              <stop offset="100%" stop-color="#3a2c3a"/>
            </linearGradient>
            <linearGradient id="scnNearMtn" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#6a4a2c"/>
              <stop offset="100%" stop-color="#3a2814"/>
            </linearGradient>
            <linearGradient id="scnGround" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#8a6a3a"/>
              <stop offset="100%" stop-color="#2c1e10"/>
            </linearGradient>
            <radialGradient id="scnFlame" cx="50%" cy="70%" r="60%">
              <stop offset="0%" stop-color="#fff3c4"/>
              <stop offset="45%" stop-color="#ffb347"/>
              <stop offset="100%" stop-color="#d94f2b"/>
            </radialGradient>
            <linearGradient id="scnMist" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
              <stop offset="50%" stop-color="#fff" stop-opacity="0.18"/>
              <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
          </defs>

          <rect x="0" y="0" width="1000" height="620" fill="url(#scnSky)"/>

          <g fill="#fff">
            <circle class="scn-star d1" cx="120" cy="80" r="1.6"/>
            <circle class="scn-star d2" cx="220" cy="140" r="1.2"/>
            <circle class="scn-star d3" cx="330" cy="60" r="1.8"/>
            <circle class="scn-star d4" cx="80" cy="200" r="1.3"/>
            <circle class="scn-star d5" cx="850" cy="90" r="1.6"/>
            <circle class="scn-star d1" cx="920" cy="160" r="1.3"/>
            <circle class="scn-star d2" cx="770" cy="60" r="1.4"/>
            <circle class="scn-star d3" cx="650" cy="120" r="1.2"/>
            <circle class="scn-star d4" cx="180" cy="110" r="1.1"/>
            <circle class="scn-star d5" cx="950" cy="230" r="1.5"/>
          </g>

          <circle cx="500" cy="180" r="190" fill="url(#scnMoonGlow)"/>
          <circle cx="500" cy="180" r="52" fill="url(#scnMoonBody)"/>
          <circle cx="484" cy="164" r="7" fill="#e4d5a0" opacity="0.6"/>
          <circle cx="512" cy="188" r="10" fill="#e4d5a0" opacity="0.5"/>
          <circle cx="494" cy="200" r="5" fill="#e4d5a0" opacity="0.5"/>

          <g fill="#2a1f30" opacity="0.35">
            <ellipse class="scn-cloud c1" cx="120" cy="150" rx="90" ry="18"/>
            <ellipse class="scn-cloud c1" cx="200" cy="140" rx="60" ry="14"/>
            <ellipse class="scn-cloud c2" cx="650" cy="90" rx="100" ry="16"/>
            <ellipse class="scn-cloud c2" cx="740" cy="100" rx="70" ry="13"/>
            <ellipse class="scn-cloud c3" cx="380" cy="230" rx="80" ry="14"/>
          </g>

          <g class="scn-dragon" fill="#0f0a14">
            <path d="M0,0 C10,-14 30,-18 46,-8 C58,-1 62,8 70,6 C80,3 86,-6 100,-4 C90,4 82,14 64,14 C74,20 90,22 100,30 C82,26 60,22 46,14 C30,22 8,24 -6,16 C6,14 20,10 28,2 C16,4 4,4 -6,-2 C4,-4 14,-8 20,-14 C10,-10 0,-8 -8,-10 C-2,-14 4,-18 6,-24 C0,-20 -8,-16 -14,-18 C-8,-20 -2,-22 0,-26 Z" transform="translate(400,120) scale(1.4)"/>
          </g>

          <path d="M0,320 L80,260 L160,300 L260,230 L340,290 L430,240 L520,300 L610,250 L700,310 L800,240 L900,290 L1000,250 L1000,400 L0,400 Z" fill="url(#scnFarMtn)" opacity="0.55"/>

          <rect class="scn-mist" x="-30" y="330" width="1060" height="46" fill="url(#scnMist)"/>

          <g fill="#241a20" opacity="0.68">
            <rect x="700" y="225" width="18" height="75"/>
            <rect x="692" y="210" width="34" height="18"/>
            <rect x="740" y="245" width="26" height="55"/>
            <rect x="732" y="233" width="42" height="16"/>
            <rect x="770" y="255" width="16" height="45"/>
            <polygon points="700,210 709,188 718,210"/>
            <polygon points="740,233 753,208 766,233"/>
            <line x1="753" y1="208" x2="753" y2="190" stroke="#241a20" stroke-width="1.5"/>
          </g>
          <polygon class="scn-flag" points="753,190 753,178 768,184" fill="#a3182f" opacity="0.75"/>
          <circle class="scn-window w1" cx="709" cy="255" r="2.2" fill="#ffcf7a"/>
          <circle class="scn-window w2" cx="753" cy="270" r="2.4" fill="#ffcf7a"/>

          <path d="M0,380 L100,320 L220,370 L340,300 L480,360 L600,310 L740,370 L860,330 L1000,375 L1000,460 L0,460 Z" fill="url(#scnNearMtn)" opacity="0.88"/>

          <path d="M0,420 Q250,390 500,415 T1000,410 L1000,620 L0,620 Z" fill="url(#scnGround)"/>

          <g>
            <rect x="66" y="470" width="7" height="60" fill="#3a2a1a"/>
            <path class="scn-flame f1" d="M69.5,455 C60,470 60,485 69.5,495 C79,485 79,470 69.5,455 Z" fill="url(#scnFlame)"/>
            <rect x="926" y="470" width="7" height="60" fill="#3a2a1a"/>
            <path class="scn-flame f2" d="M929.5,455 C920,470 920,485 929.5,495 C939,485 939,470 929.5,455 Z" fill="url(#scnFlame)"/>
          </g>

          <g fill="#ffb347">
            <circle class="scn-ember e1" cx="70" cy="480" r="2"/>
            <circle class="scn-ember e2" cx="75" cy="480" r="1.6"/>
            <circle class="scn-ember e3" cx="65" cy="480" r="1.8"/>
            <circle class="scn-ember e4" cx="930" cy="480" r="2"/>
            <circle class="scn-ember e5" cx="935" cy="480" r="1.6"/>
            <circle class="scn-ember e6" cx="925" cy="480" r="1.8"/>
          </g>

          <ellipse cx="500" cy="560" rx="220" ry="90" fill="#f3ca6c" opacity="0.15"/>
        </svg>
      </div>
      <div class="felt-veil" aria-hidden="true"></div>
      <section id="opponent-area">
        <div id="opponent-hero" class="hero" data-role="enemy-hero">
          <div class="hero-name">AI</div>
          <div class="hero-health">30</div>
        </div>
        <div id="opponent-hand" class="hand hand-back"></div>
        <div id="opponent-board" class="board" data-empty-label="상대 전장"></div>
      </section>

      <section id="middle-area">
        <div id="turn-indicator" class="turn-indicator">당신의 턴</div>
        <div id="log-panel"></div>
      </section>

      <section id="player-area">
        <div id="player-board" class="board" data-empty-label="내 전장"></div>
        <div id="bottom-row">
          <div class="hero-row">
            <div id="player-hero" class="hero" data-role="own-hero">
              <div class="hero-name">플레이어</div>
              <div class="hero-health">30</div>
            </div>
            <button id="player-hero-power" class="hero-power-btn" data-role="hero-power" title="화염 손가락: 대상에게 피해를 1 줍니다.">
              <span class="hp-icon">🔥</span><span class="hp-cost">2</span>
            </button>
          </div>
          <div id="mana-crystals"></div>
          <div id="controls">
            <button id="skip-target-btn" class="hidden" data-role="skip-target">대상 없이 사용</button>
            <button id="end-turn-btn">턴 종료</button>
          </div>
        </div>
        <div id="legend">💧 코스트(마나) &nbsp; ⚔️ 공격력 &nbsp; ❤️ 체력 &nbsp; <button id="glossary-btn" class="glossary-link">❓ 키워드 설명</button></div>
        <div id="player-hand" class="hand"></div>
      </section>
    </div>
  </div>

  <div id="game-over-overlay" class="hidden">
    <div class="overlay-box">
      <div id="game-over-text"></div>
      <div class="overlay-actions">
        <button id="restart-btn">다시 시작</button>
        <button id="main-menu-btn" class="ghost-btn">모드 선택으로</button>
      </div>
    </div>
  </div>

  <div id="handoff-overlay" class="hidden">
    <div class="overlay-box">
      <div id="handoff-text">다음 차례입니다</div>
      <div class="overlay-sub">기기를 상대 플레이어에게 넘겨주세요. 화면에는 넘겨받을 사람의 패가 표시됩니다.</div>
      <button id="handoff-ack-btn">확인했습니다, 시작</button>
    </div>
  </div>

  <div id="mode-select-overlay">
    <div class="overlay-box">
      <div id="mode-select-text">대전 상대를 선택하세요</div>
      <div class="overlay-actions overlay-actions-col">
        <button id="mode-ai-btn">🤖 AI와 대전</button>
        <button id="mode-hotseat-btn" class="ghost-btn">👥 친구와 대전 (같은 기기)</button>
        <button id="mode-online-btn" class="ghost-btn">🌐 친구와 온라인 대전 (다른 기기)</button>
      </div>
      <div class="overlay-sub">같은 기기 대전은 턴마다 화면을 서로 넘겨가며 플레이합니다. 온라인 대전은 방 코드를 공유해 서로 다른 기기에서 접속합니다.</div>
    </div>
  </div>

  <div id="online-menu-overlay" class="hidden">
    <div class="overlay-box">
      <div class="overlay-text">온라인 대전</div>
      <div class="overlay-actions overlay-actions-col">
        <button id="online-create-btn">🔑 방 만들기</button>
        <button id="online-join-toggle-btn" class="ghost-btn">➡️ 코드로 참가하기</button>
      </div>
      <div id="online-join-form" class="online-join-form hidden">
        <input id="online-code-input" class="online-code-input" maxlength="6" placeholder="방 코드 6자리" autocomplete="off" />
        <button id="online-join-btn">참가</button>
      </div>
      <div id="online-error" class="online-error hidden"></div>
      <button id="online-back-btn" class="ghost-btn btn-small">← 뒤로</button>
    </div>
  </div>

  <div id="online-waiting-overlay" class="hidden">
    <div class="overlay-box">
      <div class="overlay-text" id="online-waiting-title">상대를 기다리는 중...</div>
      <div id="online-room-code" class="online-room-code"></div>
      <div class="overlay-sub" id="online-waiting-sub">이 코드를 친구에게 알려주세요. 친구가 "코드로 참가하기"에 입력하면 자동으로 시작됩니다.</div>
      <button id="online-cancel-btn" class="ghost-btn btn-small">취소</button>
    </div>
  </div>

  <div id="glossary-overlay" class="hidden">
    <div class="overlay-box glossary-box">
      <div class="overlay-text">키워드 설명</div>
      <div id="glossary-list"></div>
      <button id="glossary-close-btn" class="ghost-btn btn-small">닫기</button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
