<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메이플랜드 미니</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <h1>🍁 메이플랜드 미니</h1>
    <canvas id="game" width="800" height="450"></canvas>
    <div id="hud">
      <div class="stat">Lv. <span id="level">1</span></div>
      <div class="bar hp"><div id="hp-fill" class="fill"></div><span id="hp-text" class="bar-text"></span></div>
      <div class="bar mp"><div id="mp-fill" class="fill"></div><span id="mp-text" class="bar-text"></span></div>
      <div class="bar exp"><div id="exp-fill" class="fill"></div><span id="exp-text" class="bar-text"></span></div>
      <div class="stat">처치 <span id="kills">0</span></div>
    </div>
    <p id="help">← → 이동 · ↑ / Space 점프 · Z 공격</p>
  </div>
  <script src="game.js"></script>
</body>
</html>
