<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>마나 듀얼 - 카드 대전 초안</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">
  <header id="top-bar">
    <h1>마나 듀얼</h1>
    <div id="turn-indicator">당신의 턴</div>
  </header>

  <section id="opponent-area">
    <div id="opponent-hero" class="hero" data-role="enemy-hero">
      <div class="hero-name">AI</div>
      <div class="hero-health">30</div>
    </div>
    <div id="opponent-hand" class="hand hand-back"></div>
    <div id="opponent-board" class="board" data-empty-label="상대 전장"></div>
  </section>

  <section id="middle-area">
    <div id="log-panel"></div>
  </section>

  <section id="player-area">
    <div id="player-board" class="board" data-empty-label="내 전장"></div>
    <div id="bottom-row">
      <div class="hero-row">
        <div id="player-hero" class="hero" data-role="own-hero">
          <div class="hero-name">플레이어</div>
          <div class="hero-health">30</div>
        </div>
        <button id="player-hero-power" class="hero-power-btn" data-role="hero-power" title="화염 손가락: 대상에게 피해를 1 줍니다.">
          <span class="hp-icon">🔥</span><span class="hp-cost">2</span>
        </button>
      </div>
      <div id="mana-crystals"></div>
      <div id="controls">
        <button id="skip-target-btn" class="hidden" data-role="skip-target">대상 없이 사용</button>
        <button id="end-turn-btn">턴 종료</button>
      </div>
    </div>
    <div id="player-hand" class="hand"></div>
  </section>

  <div id="game-over-overlay" class="hidden">
    <div id="game-over-box">
      <div id="game-over-text"></div>
      <div class="overlay-actions">
        <button id="restart-btn">다시 시작</button>
        <button id="main-menu-btn" class="ghost-btn">모드 선택으로</button>
      </div>
    </div>
  </div>

  <div id="handoff-overlay" class="hidden">
    <div id="game-over-box">
      <div id="handoff-text">다음 차례입니다</div>
      <div class="overlay-sub">기기를 상대 플레이어에게 넘겨주세요. 화면에는 넘겨받을 사람의 패가 표시됩니다.</div>
      <button id="handoff-ack-btn">확인했습니다, 시작</button>
    </div>
  </div>

  <div id="mode-select-overlay">
    <div id="game-over-box">
      <div id="mode-select-text">대전 상대를 선택하세요</div>
      <div class="overlay-actions overlay-actions-col">
        <button id="mode-ai-btn">🤖 AI와 대전</button>
        <button id="mode-hotseat-btn" class="ghost-btn">👥 친구와 대전 (같은 기기)</button>
      </div>
      <div class="overlay-sub">같은 기기 대전은 턴마다 화면을 서로 넘겨가며 플레이합니다.</div>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
