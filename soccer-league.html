<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>축구 리그 매니저</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gugi&family=Oswald:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #0c1f16;
  --panel: #142a1e;
  --panel-2: #1c3527;
  --panel-3: #24402f;
  --border: #2a4535;
  --text: #eaf3ec;
  --text-dim: #8fac9a;
  --accent: #e8c547;
  --accent-2: #4f9fe0;
  --danger: #e0544f;
  --good: #5cc16f;
  --warn: #e0b23a;
  --font-display: "Gugi", "Noto Sans KR", sans-serif;
  --font-score: "Oswald", "Noto Sans KR", sans-serif;
  --font-body: "Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
}

#app {
  max-width: 1080px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 12px 14px 28px;
  gap: 12px;
}

#topbar {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
}
#topbar .tb-group { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
#topbar .tb-item { display: flex; flex-direction: column; }
#topbar .tb-label { font-size: 0.72em; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
#topbar .tb-value { font-weight: 700; font-variant-numeric: tabular-nums; }
#clubName { font-family: var(--font-display); color: var(--accent); font-size: 1.15em; }

#mainArea {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 12px;
  align-items: start;
}
@media (max-width: 860px) {
  #mainArea { grid-template-columns: 1fr; }
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
}

.panel h2 {
  font-family: var(--font-display);
  font-weight: 400;
  color: var(--accent);
  margin: 0 0 4px;
  font-size: 1.3em;
  text-wrap: balance;
}
.panel .sub-hint { color: var(--text-dim); font-size: 0.85em; margin: 0 0 14px; line-height: 1.5; }

#sidePanel { display: flex; flex-direction: column; gap: 12px; }

/* ---- fixture / matchup card ---- */
.matchup {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 14px 10px 20px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.matchup .side { text-align: center; flex: 1; }
.matchup .side .team-name { font-weight: 700; font-size: 1.05em; }
.matchup .side .team-rating { color: var(--text-dim); font-size: 0.78em; }
.matchup .vs { font-family: var(--font-score); font-size: 1.1em; color: var(--text-dim); }
.matchup .side.you .team-name { color: var(--accent-2); }
.home-tag { display:inline-block; font-size: 0.68em; color: var(--good); border: 1px solid var(--good); border-radius: 4px; padding: 1px 5px; margin-top: 3px; }
.away-tag { display:inline-block; font-size: 0.68em; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 1px 5px; margin-top: 3px; }

/* ---- formation / squad list ---- */
.slot-group { margin-bottom: 14px; }
.slot-group-label { font-size: 0.78em; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
.slot-row { display: flex; flex-wrap: wrap; gap: 8px; }
.slot {
  flex: 1 1 150px;
  min-width: 150px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  border-radius: 8px;
  padding: 8px 10px;
  cursor: pointer;
}
.slot:hover { border-color: var(--accent-2); }
.slot.empty { color: var(--text-dim); font-style: italic; }
.slot .p-name { font-weight: 600; }
.slot .p-meta { font-size: 0.78em; color: var(--text-dim); display: flex; gap: 8px; margin-top: 2px; }
.stamina-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:3px; vertical-align: middle; }

.controls-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
.pill-btn {
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 999px;
  padding: 7px 14px;
  font-size: 0.85em;
  cursor: pointer;
  font-family: var(--font-body);
}
.pill-btn.active { background: var(--accent-2); border-color: var(--accent-2); color: #08131c; font-weight: 700; }
.pill-btn:hover:not(.active) { border-color: var(--accent-2); }

button.primary-btn {
  background: var(--accent);
  color: #241d05;
  border: none;
  border-radius: 8px;
  padding: 12px 20px;
  font-weight: 700;
  font-size: 1em;
  cursor: pointer;
  font-family: var(--font-body);
}
button.primary-btn:disabled { opacity: 0.4; cursor: not-allowed; }
button.primary-btn:hover:not(:disabled) { filter: brightness(1.08); }

button.ghost-btn {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 16px;
  cursor: pointer;
  font-family: var(--font-body);
}
button.ghost-btn:hover { border-color: var(--accent-2); }

/* ---- league table ---- */
table.league-table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
table.league-table th, table.league-table td {
  padding: 6px 6px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
}
table.league-table th { color: var(--text-dim); font-weight: 500; font-size: 0.85em; }
table.league-table td.team-cell { text-align: left; }
table.league-table tr.you { background: rgba(79,159,224,0.14); }
table.league-table tr.you td.team-cell { color: var(--accent-2); font-weight: 700; }
table.league-table td.pts { font-weight: 700; color: var(--accent); }

/* ---- match report ---- */
.scoreboard {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 22px;
  padding: 18px 10px 22px;
}
.scoreboard .team-block { flex: 1; text-align: center; }
.scoreboard .team-block .team-name { font-weight: 700; font-size: 1.1em; }
.scoreboard .score {
  font-family: var(--font-score);
  font-weight: 700;
  font-size: 2.6em;
  letter-spacing: 0.05em;
  color: var(--text);
  display: flex;
  gap: 14px;
  align-items: center;
}
.scoreboard .score .num.win { color: var(--good); }
.scoreboard .score .dash { color: var(--text-dim); font-size: 0.6em; }

.commentary-list { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.commentary-list li {
  display: flex; gap: 10px; align-items: baseline;
  font-size: 0.9em; border-left: 2px solid var(--border); padding-left: 10px;
}
.commentary-list li .min { font-family: var(--font-score); color: var(--text-dim); width: 34px; flex-shrink:0; }
.commentary-list li.goal { border-color: var(--accent); }
.commentary-list li.goal .min { color: var(--accent); }

/* ---- transfer market ---- */
#transferOverlay, #startOverlay, #summaryOverlay {
  position: fixed; inset: 0; background: rgba(6,12,9,0.86);
  display: flex; align-items: center; justify-content: center;
  z-index: 50; padding: 18px;
}
#transferOverlay.hidden, #summaryOverlay.hidden { display: none; }
.modal-box {
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
  padding: 22px; width: 100%; max-width: 640px; max-height: 86vh; overflow-y: auto;
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.modal-header h2 { margin: 0; }

.player-row {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; margin-bottom: 8px;
  background: var(--panel-2);
}
.player-row .p-info { display: flex; flex-direction: column; }
.player-row .p-info .p-name { font-weight: 700; }
.player-row .p-info .p-meta { font-size: 0.78em; color: var(--text-dim); }
.player-row button { flex-shrink: 0; }

#startBox, #summaryBox { text-align: center; }
#startBox h1, #summaryBox h1 {
  font-family: var(--font-display); font-weight: 400; color: var(--accent);
  font-size: 1.8em; text-wrap: balance;
}
.club-pick-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; margin: 18px 0; }
.club-pick {
  border: 1px solid var(--border); background: var(--panel-2); border-radius: 10px;
  padding: 12px; cursor: pointer; text-align: left;
}
.club-pick:hover { border-color: var(--accent-2); }
.club-pick.selected { border-color: var(--accent); background: var(--panel-3); }
.club-pick .cp-name { font-weight: 700; }
.club-pick .cp-rating { color: var(--text-dim); font-size: 0.8em; margin-top: 4px; }

#newsFeed { max-height: 150px; overflow-y: auto; }
#newsList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column-reverse; gap: 4px; }
#newsList li { font-size: 0.83em; color: var(--text-dim); border-left: 2px solid var(--border); padding-left: 8px; }
#newsList li.hi { color: var(--accent); border-color: var(--accent); }

.tab-row { display: flex; gap: 6px; margin-bottom: 10px; }
.tab-btn {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 6px 6px 0 0; padding: 6px 12px; cursor: pointer; font-size: 0.85em; font-family: var(--font-body);
}
.tab-btn.active { color: var(--accent); border-bottom-color: var(--panel); background: var(--panel-3); }

.injured-tag { color: var(--danger); font-size: 0.75em; border: 1px solid var(--danger); border-radius: 4px; padding: 1px 5px; }

.hidden { display: none !important; }
</style>
</head>
<body>

<div id="app">

  <header id="topbar">
    <div class="tb-group">
      <span id="clubName">FC</span>
    </div>
    <div class="tb-group">
      <div class="tb-item"><span class="tb-label">시즌</span><span class="tb-value" id="tbSeason">1</span></div>
      <div class="tb-item"><span class="tb-label">라운드</span><span class="tb-value" id="tbRound">1 / 18</span></div>
      <div class="tb-item"><span class="tb-label">순위</span><span class="tb-value" id="tbRank">-</span></div>
      <div class="tb-item"><span class="tb-label">예산</span><span class="tb-value" id="tbBudget">0억</span></div>
    </div>
  </header>

  <main id="mainArea">
    <section class="panel" id="centerPanel"></section>

    <section id="sidePanel">
      <div class="panel">
        <div class="tab-row">
          <button class="tab-btn active" id="tabTableBtn">순위표</button>
          <button class="tab-btn" id="tabScorersBtn">득점왕</button>
        </div>
        <div id="tableWrap"></div>
      </div>
      <div class="panel">
        <h2 style="font-size:1.05em;margin-bottom:8px;">이적시장</h2>
        <p class="sub-hint" style="margin-bottom:10px;">선수를 사고팔아 스쿼드를 강화하세요.</p>
        <button class="ghost-btn" id="openTransferBtn" style="width:100%;">이적시장 열기</button>
      </div>
      <div class="panel" id="newsFeed">
        <h2 style="font-size:1.05em;">소식</h2>
        <ul id="newsList"></ul>
      </div>
    </section>
  </main>

</div>

<div id="transferOverlay" class="hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h2>이적시장</h2>
      <button class="ghost-btn" id="closeTransferBtn">닫기</button>
    </div>
    <div class="tab-row">
      <button class="tab-btn active" id="tabBuyBtn">영입</button>
      <button class="tab-btn" id="tabSellBtn">방출</button>
    </div>
    <div id="transferList"></div>
  </div>
</div>

<div id="summaryOverlay" class="hidden">
  <div class="modal-box" id="summaryBox"></div>
</div>

<div id="startOverlay">
  <div class="modal-box" id="startBox">
    <h1>⚽ 축구 리그 매니저</h1>
    <p class="sub-hint">10개 구단이 겨루는 왕복 라운드로빈 리그(18라운드). 감독이 되어 스쿼드를 꾸리고, 전술을 짜고, 시즌을 우승으로 이끄세요.</p>
    <p class="sub-hint">실시간이 아닌 라운드 단위로 진행됩니다 — 매 라운드 선발 명단을 정하고 경기를 시작하면 즉시 결과가 나옵니다.</p>
    <h2 style="font-size:1.05em;">지휘할 구단을 선택하세요</h2>
    <div class="club-pick-list" id="clubPickList"></div>
    <button class="primary-btn" id="startSeasonBtn" disabled>시즌 시작</button>
  </div>
</div>

<script>
/* ===========================================================
   축구 리그 매니저 — 라운드 기반 시즌 시뮬레이션 (실시간 없음)
=========================================================== */

const TEAM_NAMES = [
  "서울 유나이티드", "부산 오션즈", "대구 스틸러스", "인천 하버",
  "광주 스피릿", "대전 볼케이노", "울산 타이거즈", "전주 로얄스",
  "강릉 폴라베어스", "제주 드래곤즈",
];

const SURNAMES = ["김","이","박","최","정","강","조","윤","장","임","한","오","서","신","권","황","안","송","전","홍"];
const GIVEN_NAMES = ["민준","서준","도윤","예준","시우","주원","하준","지호","준서","건우","현우","지훈","동현","성민","재현","우진","윤호","태양","민재","승현","경수","진우","영훈","상우","규현"];

function randomName(usedSet) {
  let name;
  let tries = 0;
  do {
    name = choice(SURNAMES) + choice(GIVEN_NAMES);
    tries++;
  } while (usedSet && usedSet.has(name) && tries < 20);
  if (usedSet) usedSet.add(name);
  return name;
}

const POSITIONS = ["GK", "DF", "MF", "FW"];
const POSITION_LABEL = { GK: "골키퍼", DF: "수비수", MF: "미드필더", FW: "공격수" };
const FORMATION = { GK: 1, DF: 4, MF: 3, FW: 3 };
const TOTAL_ROUNDS = 18;
const SQUAD_MAX = 22;

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function chance(p) { return Math.random() < p; }
function choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function clampNum(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function poissonSample(lambda) {
  const L = Math.exp(-lambda);
  let k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > L);
  return k - 1;
}

/* ---------------- State ---------------- */

let state = null;

function makeSquad(usedNames) {
  const squad = [];
  let id = 1;
  const counts = { GK: 2, DF: 6, MF: 6, FW: 4 };
  Object.entries(counts).forEach(([pos, n]) => {
    for (let i = 0; i < n; i++) {
      squad.push({
        id: id++,
        name: randomName(usedNames),
        pos,
        rating: rand(60, 78),
        stamina: 100,
        injuredRounds: 0,
        goals: 0,
        apps: 0,
      });
    }
  });
  return squad;
}

function makeAiTeams(usedNames) {
  return TEAM_NAMES.map((name, idx) => ({
    id: idx,
    name,
    attack: rand(55, 85),
    defense: rand(55, 85),
    starName: randomName(usedNames),
    starGoals: 0,
  }));
}

function generateRoundRobin(teamIds) {
  const n = teamIds.length;
  const arr = teamIds.slice();
  const firstHalf = [];
  for (let r = 0; r < n - 1; r++) {
    const roundMatches = [];
    for (let i = 0; i < n / 2; i++) {
      const home = arr[i];
      const away = arr[n - 1 - i];
      if (r % 2 === 0) roundMatches.push({ home, away });
      else roundMatches.push({ home: away, away: home });
    }
    firstHalf.push(roundMatches);
    const fixed = arr[0];
    const rest = arr.slice(1);
    rest.unshift(rest.pop());
    arr.splice(0, arr.length, fixed, ...rest);
  }
  const secondHalf = firstHalf.map(round => round.map(m => ({ home: m.away, away: m.home })));
  return [...firstHalf, ...secondHalf];
}

function freshStandings(teams) {
  const s = {};
  teams.forEach(t => { s[t.id] = { played: 0, won: 0, draw: 0, lost: 0, gf: 0, ga: 0, pts: 0 }; });
  return s;
}

function makeTransferBatch(usedNames) {
  const batch = [];
  for (let i = 0; i < 6; i++) {
    batch.push({
      id: "tm" + Date.now() + i + Math.random(),
      name: randomName(usedNames),
      pos: choice(POSITIONS),
      rating: rand(58, 84),
      stamina: 100,
      injuredRounds: 0,
      goals: 0,
      apps: 0,
    });
  }
  return batch;
}

function estimateValue(p) {
  return Math.round(Math.pow(p.rating / 10, 2) * 3);
}

function startNewCareer(userTeamIdx) {
  const usedNames = new Set();
  const teams = makeAiTeams(usedNames);
  const squad = makeSquad(usedNames);
  const fixtures = generateRoundRobin(teams.map(t => t.id));

  state = {
    season: 1,
    round: 0,
    userTeamId: userTeamIdx,
    teams,
    standings: freshStandings(teams),
    fixtures,
    squad,
    lineup: null,
    tactic: "balanced",
    training: "attack",
    budget: 500,
    transferMarket: makeTransferBatch(usedNames),
    usedNames: [...usedNames],
    news: [],
    screen: "lineup",
    lastReport: null,
    over: false,
    activeTableTab: "table",
    activeTransferTab: "buy",
  };
  autoFillLineup();
  addNews(`${teamName(userTeamIdx)} 감독으로 부임했다. 시즌 1 개막!`, true);
}

function teamName(id) { return state.teams.find(t => t.id === id).name; }
function isUser(id) { return id === state.userTeamId; }

function addNews(msg, hi) {
  state.news.push({ msg, hi: !!hi });
  if (state.news.length > 50) state.news.shift();
}

/* ---------------- Lineup helpers ---------------- */

function availablePlayers(pos) {
  return state.squad.filter(p => p.pos === pos);
}

function effectiveRating(p) {
  return p.injuredRounds > 0 ? p.rating * 0.5 : p.rating;
}

function autoFillLineup() {
  const lineup = { GK: null, DF: [], MF: [], FW: [] };
  POSITIONS.forEach(pos => {
    const pool = availablePlayers(pos).slice().sort((a, b) => effectiveRating(b) - effectiveRating(a));
    const need = FORMATION[pos];
    if (pos === "GK") {
      lineup.GK = pool[0] ? pool[0].id : null;
    } else {
      lineup[pos] = pool.slice(0, need).map(p => p.id);
      while (lineup[pos].length < need) lineup[pos].push(null);
    }
  });
  state.lineup = lineup;
}

function refillLineupGaps() {
  POSITIONS.forEach(pos => {
    const used = lineupIds();
    const pool = availablePlayers(pos).filter(p => !used.includes(p.id)).sort((a, b) => effectiveRating(b) - effectiveRating(a));
    if (pos === "GK") {
      if (!state.lineup.GK) {
        const pick = pool[0];
        if (pick) state.lineup.GK = pick.id;
      }
    } else {
      state.lineup[pos] = state.lineup[pos].map(id => {
        if (id) return id;
        const pick = pool.shift();
        return pick ? pick.id : null;
      });
    }
  });
}

function lineupIds() {
  const l = state.lineup;
  return [l.GK, ...l.DF, ...l.MF, ...l.FW].filter(Boolean);
}

function lineupComplete() {
  const l = state.lineup;
  return l.GK && l.DF.filter(Boolean).length === 4 && l.MF.filter(Boolean).length === 3 && l.FW.filter(Boolean).length === 3;
}

function playerById(id) { return state.squad.find(p => p.id === id); }

function setSlot(pos, index, playerId) {
  if (pos === "GK") { state.lineup.GK = playerId; return; }
  state.lineup[pos][index] = playerId;
}

/* ---------------- Team strength ---------------- */

function avgRating(ids, pos) {
  const list = ids.map(playerById).filter(p => p && p.pos === pos);
  if (!list.length) return 55;
  return list.reduce((s, p) => s + effectiveRating(p) * (0.85 + 0.15 * p.stamina / 100), 0) / list.length;
}

function userTeamStrength() {
  const ids = lineupIds();
  const gk = avgRating(ids, "GK");
  const df = avgRating(ids, "DF");
  const mf = avgRating(ids, "MF");
  const fw = avgRating(ids, "FW");
  let attack = fw * 0.55 + mf * 0.35 + df * 0.10;
  let defense = df * 0.55 + mf * 0.30 + gk * 0.15;
  if (state.tactic === "attack") { attack *= 1.12; defense *= 0.90; }
  if (state.tactic === "defense") { attack *= 0.90; defense *= 1.12; }
  return { attack, defense };
}

/* ---------------- Match simulation ---------------- */

function simulateScore(attack, defense, oppAttack, oppDefense, homeAdv) {
  const expFor = clampNum(1.1 + (attack - oppDefense) / 18 + (homeAdv ? 0.18 : 0), 0.15, 4.6);
  const goals = poissonSample(expFor);
  return goals;
}

function pickScorerFromLineup() {
  const ids = lineupIds();
  const pool = [];
  ids.forEach(id => {
    const p = playerById(id);
    if (!p) return;
    let w = 1;
    if (p.pos === "FW") w = 6;
    else if (p.pos === "MF") w = 3;
    else if (p.pos === "DF") w = 0.6;
    else w = 0.1;
    w *= (p.rating / 70);
    pool.push({ p, w });
  });
  const total = pool.reduce((s, x) => s + x.w, 0);
  let r = Math.random() * total;
  for (const x of pool) { r -= x.w; if (r <= 0) return x.p; }
  return pool[0] ? pool[0].p : null;
}

function playUserMatch() {
  const fixture = state.fixtures[state.round].find(m => m.home === state.userTeamId || m.away === state.userTeamId);
  const userIsHome = fixture.home === state.userTeamId;
  const oppId = userIsHome ? fixture.away : fixture.home;
  const opp = state.teams.find(t => t.id === oppId);
  const oppVariance = () => rand(-6, 6);

  const { attack, defense } = userTeamStrength();
  const oppAttack = opp.attack + oppVariance();
  const oppDefense = opp.defense + oppVariance();

  const userGoals = simulateScore(attack, defense, oppAttack, oppDefense, userIsHome);
  const oppGoals = simulateScore(oppAttack, oppDefense, attack, defense, !userIsHome);

  const events = [];
  for (let i = 0; i < userGoals; i++) {
    const scorer = pickScorerFromLineup();
    events.push({ minute: rand(1, 90), side: "user", scorer: scorer ? scorer.name : "우리 팀" });
    if (scorer) scorer.goals++;
  }
  for (let i = 0; i < oppGoals; i++) {
    const scorer = chance(0.75) ? opp.starName : "무명의 " + POSITION_LABEL[choice(["MF", "FW"])];
    events.push({ minute: rand(1, 90), side: "opp", scorer });
    if (scorer === opp.starName) opp.starGoals++;
  }
  events.sort((a, b) => a.minute - b.minute);

  // fatigue + injuries for starters
  const starterIds = lineupIds();
  starterIds.forEach(id => {
    const p = playerById(id);
    p.apps++;
    p.stamina = clampNum(p.stamina - rand(8, 18), 30, 100);
    if (chance(0.05)) {
      p.injuredRounds = 1;
      addNews(`${p.name} 선수가 경기 중 무리하여 다음 라운드에 결장합니다.`, false);
    }
  });
  state.squad.forEach(p => {
    if (!starterIds.includes(p.id)) {
      p.stamina = clampNum(p.stamina + 20, 0, 100);
      if (p.injuredRounds > 0) p.injuredRounds--;
    }
  });

  applyResult(state.userTeamId, oppId, userGoals, oppGoals);

  const homeGoals = userIsHome ? userGoals : oppGoals;
  const awayGoals = userIsHome ? oppGoals : userGoals;

  state.lastReport = {
    homeTeam: teamName(fixture.home),
    awayTeam: teamName(fixture.away),
    homeGoals, awayGoals,
    userIsHome,
    events,
    result: userGoals > oppGoals ? "win" : userGoals === oppGoals ? "draw" : "loss",
  };

  // prize money
  const rank = currentUserRank();
  let income = 40;
  if (rank <= 3) income = 90;
  else if (rank <= 6) income = 60;
  if (state.lastReport.result === "win") income += 30;
  else if (state.lastReport.result === "draw") income += 10;
  state.budget += income;
  addNews(`[${state.round + 1}R] ${fixture.home === state.userTeamId ? teamName(fixture.home) : opp.name} ${homeGoals} - ${awayGoals} ${fixture.away === state.userTeamId ? teamName(fixture.away) : opp.name}. 수입 ${income}억 획득.`, state.lastReport.result === "win");

  applyTraining();
  simulateOtherMatches();
}

function simulateOtherMatches() {
  const round = state.fixtures[state.round];
  round.forEach(m => {
    if (m.home === state.userTeamId || m.away === state.userTeamId) return;
    const home = state.teams.find(t => t.id === m.home);
    const away = state.teams.find(t => t.id === m.away);
    const hg = simulateScore(home.attack + rand(-6, 6), home.defense + rand(-6, 6), away.attack, away.defense, true);
    const ag = simulateScore(away.attack + rand(-6, 6), away.defense + rand(-6, 6), home.attack, home.defense, false);
    applyResult(m.home, m.away, hg, ag);
    for (let i = 0; i < hg; i++) if (chance(0.6)) home.starGoals++;
    for (let i = 0; i < ag; i++) if (chance(0.6)) away.starGoals++;
  });
}

function applyResult(homeId, awayId, hg, ag) {
  const sh = state.standings[homeId];
  const sa = state.standings[awayId];
  sh.played++; sa.played++;
  sh.gf += hg; sh.ga += ag;
  sa.gf += ag; sa.ga += hg;
  if (hg > ag) { sh.won++; sh.pts += 3; sa.lost++; }
  else if (hg < ag) { sa.won++; sa.pts += 3; sh.lost++; }
  else { sh.draw++; sa.draw++; sh.pts += 1; sa.pts += 1; }
}

function sortedStandings() {
  return state.teams
    .map(t => ({ team: t, ...state.standings[t.id] }))
    .sort((a, b) => (b.pts - a.pts) || ((b.gf - b.ga) - (a.gf - a.ga)) || (b.gf - a.gf));
}

function currentUserRank() {
  const table = sortedStandings();
  return table.findIndex(r => r.team.id === state.userTeamId) + 1;
}

function applyTraining() {
  const targetPos = state.training === "attack" ? ["FW", "MF"] : state.training === "defense" ? ["DF", "GK"] : null;
  if (targetPos) {
    const improved = [];
    state.squad.filter(p => targetPos.includes(p.pos)).forEach(p => {
      if (chance(0.22) && p.rating < 95) {
        p.rating += 1;
        improved.push(p);
      }
    });
    const label = state.training === "attack" ? "공격 훈련" : "수비 훈련";
    if (improved.length) {
      addNews(`[${label}] ${improved.map(p => `${p.name}(${p.rating - 1}→${p.rating})`).join(", ")} 능력치 상승!`, true);
    } else {
      addNews(`[${label}] 이번 라운드는 눈에 띄는 성장이 없었다.`, false);
    }
  } else if (state.training === "fitness") {
    let boosted = 0;
    state.squad.forEach(p => {
      if (p.stamina < 100) boosted++;
      p.stamina = clampNum(p.stamina + 10, 0, 100);
    });
    addNews(`[체력 훈련] 스쿼드 전원의 체력을 +10 회복시켰다${boosted ? ` (${boosted}명 회복)` : ""}.`, true);
  }
}

/* ---------------- Round progression ---------------- */

function goToNextRound() {
  state.round++;
  if (state.round >= TOTAL_ROUNDS) {
    state.over = true;
    render();
    return;
  }
  state.transferMarket = makeTransferBatch(new Set(state.usedNames));
  autoFillLineup();
  state.screen = "lineup";
  render();
}

/* ---------------- Transfer market ---------------- */

function buyPlayer(tmId) {
  const p = state.transferMarket.find(x => x.id === tmId);
  if (!p) return;
  const cost = estimateValue(p);
  if (state.budget < cost) return;
  if (state.squad.length >= SQUAD_MAX) return;
  state.budget -= cost;
  state.squad.push({ ...p, id: Math.max(0, ...state.squad.map(s => s.id)) + 1 });
  state.transferMarket = state.transferMarket.filter(x => x.id !== tmId);
  addNews(`${p.name} 선수를 ${cost}억에 영입했다.`, true);
  renderTransferList();
  render();
}

function sellPlayer(playerId) {
  const p = playerById(playerId);
  if (!p) return;
  const remainingInPos = state.squad.filter(x => x.pos === p.pos && x.id !== playerId).length;
  if (remainingInPos < FORMATION[p.pos]) return;
  const value = Math.round(estimateValue(p) * 0.7);
  state.budget += value;
  state.squad = state.squad.filter(x => x.id !== playerId);
  if (state.lineup.GK === playerId) state.lineup.GK = null;
  ["DF", "MF", "FW"].forEach(pos => {
    state.lineup[pos] = state.lineup[pos].map(id => id === playerId ? null : id);
  });
  refillLineupGaps();
  addNews(`${p.name} 선수를 ${value}억에 방출했다.`, false);
  renderTransferList();
  render();
}

  if (v > 65) return "var(--good)";
  if (v > 35) return "var(--warn)";

}

function render() {
  if (!state) return;
  el("clubName").textContent = teamName(state.userTeamId);
  el("tbSeason").textContent = state.season;
  el("tbRound").textContent = `${Math.min(state.round + 1, TOTAL_ROUNDS)} / ${TOTAL_ROUNDS}`;
  el("tbRank").textContent = currentUserRank() + "위";
  el("tbBudget").textContent = state.budget + "억";

  renderTableOrScorers();
  renderNews();
  renderCenterPanel();

  el("summaryOverlay").classList.toggle("hidden", !state.over);
  if (state.over) renderSummary();
}

function renderCenterPanel() {
  const panel = el("centerPanel");

}

        <div class="team-name">${opp.name}</div>
        <div class="team-rating">종합 ${oppOverall}</div>
        ${!userIsHome ? '<span class="home-tag">HOME</span>' : '<span class="away-tag">AWAY</span>'}

    if (pos === "GK") {
      html += slotHtml(pos, 0, state.lineup.GK);

      for (let i = 0; i < need; i++) html += slotHtml(pos, i, state.lineup[pos][i]);

  });

  html += `
    <div class="slot-group">
      <div class="slot-group-label">전술</div>
      <div class="controls-row">
        <button class="pill-btn tactic-btn ${state.tactic === 'attack' ? 'active' : ''}" data-tactic="attack">공격적</button>
        <button class="pill-btn tactic-btn ${state.tactic === 'balanced' ? 'active' : ''}" data-tactic="balanced">균형</button>
        <button class="pill-btn tactic-btn ${state.tactic === 'defense' ? 'active' : ''}" data-tactic="defense">수비적</button>
      </div>
    </div>

      <div class="slot-group-label">훈련 포커스 (경기 후 적용)</div>
      <div class="controls-row">
        <button class="pill-btn train-btn ${state.training === 'attack' ? 'active' : ''}" data-train="attack">공격 훈련</button>
        <button class="pill-btn train-btn ${state.training === 'defense' ? 'active' : ''}" data-train="defense">수비 훈련</button>
        <button class="pill-btn train-btn ${state.training === 'fitness' ? 'active' : ''}" data-train="fitness">체력 훈련</button>
      </div>

  `;
  return html;
}

function slotHtml(pos, index, playerId) {
  const p = playerId ? playerById(playerId) : null;
  if (!p) {
    return `<div class="slot empty" data-pos="${pos}" data-index="${index}">선수 선택...</div>`;
  }
  return `
    <div class="slot" data-pos="${pos}" data-index="${index}">
      <div class="p-name">${p.name}</div>
      <div class="p-meta">
        <span>능력 ${p.rating}</span>
        <span><span class="stamina-dot" style="background:${staminaColor(p.stamina)}"></span>체력 ${p.stamina}</span>
      </div>
    </div>
  `;
}

function bindLineupScreen() {
  document.querySelectorAll(".slot").forEach(slotEl => {
    slotEl.addEventListener("click", () => openSlotPicker(slotEl.dataset.pos, parseInt(slotEl.dataset.index)));
  });
  document.querySelectorAll(".tactic-btn").forEach(btn => {
    btn.addEventListener("click", () => { state.tactic = btn.dataset.tactic; render(); });
  });
  document.querySelectorAll(".train-btn").forEach(btn => {
    btn.addEventListener("click", () => { state.training = btn.dataset.train; render(); });
  });
  const playBtn = el("playMatchBtn");
  if (playBtn) playBtn.addEventListener("click", () => {
    playUserMatch();
    state.screen = "report";
    render();
  });
}

function openSlotPicker(pos, index) {
  const pool = availablePlayers(pos).slice().sort((a, b) => effectiveRating(b) - effectiveRating(a));
  const currentIds = lineupIds();
  const options = pool.map(p => {
    const taken = currentIds.includes(p.id) && !(pos === "GK" ? state.lineup.GK === p.id : state.lineup[pos][index] === p.id);
    return { p, taken };
  });
  const panel = el("centerPanel");
  const pickerDiv = document.createElement("div");
  pickerDiv.className = "modal-box";
  pickerDiv.style.position = "fixed";
  pickerDiv.style.top = "50%";
  pickerDiv.style.left = "50%";
  pickerDiv.style.transform = "translate(-50%,-50%)";
  pickerDiv.style.zIndex = "70";
  pickerDiv.innerHTML = `
    <div class="modal-header"><h2>${POSITION_LABEL[pos]} 선택</h2><button class="ghost-btn" id="pickerClose">닫기</button></div>
    <div>${options.map(o => `
      <div class="player-row">
        <div class="p-info">
          <span class="p-name">${o.p.name} ${o.taken ? '<span style="color:var(--text-dim);font-size:0.8em;">(다른 슬롯에 배치됨)</span>' : ''}</span>
          <span class="p-meta">능력 ${o.p.rating} · 체력 ${o.p.stamina}${o.p.injuredRounds > 0 ? ' · <span class="injured-tag">부상</span>' : ''}</span>
        </div>
        <button class="ghost-btn pick-choice-btn" data-id="${o.p.id}">선택</button>
      </div>
    `).join("")}</div>
  `;
  const backdrop = document.createElement("div");
  backdrop.style.position = "fixed";
  backdrop.style.inset = "0";
  backdrop.style.background = "rgba(6,12,9,0.7)";
  backdrop.style.zIndex = "65";
  document.body.appendChild(backdrop);
  document.body.appendChild(pickerDiv);

  function cleanup() { pickerDiv.remove(); backdrop.remove(); }
  pickerDiv.querySelector("#pickerClose").onclick = cleanup;
  backdrop.onclick = cleanup;
  pickerDiv.querySelectorAll(".pick-choice-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      setSlot(pos, index, parseInt(btn.dataset.id));
      cleanup();
      render();
    });
  });
}

function renderSummary() {
  const table = sortedStandings();
  const rank = currentUserRank();
  const champion = table[0].team.name;
  const topScorers = [];
  state.squad.forEach(p => { if (p.goals > 0) topScorers.push({ name: p.name, goals: p.goals }); });
  state.teams.forEach(t => { if (t.starGoals > 0) topScorers.push({ name: t.starName, goals: t.starGoals }); });
  topScorers.sort((a, b) => b.goals - a.goals);
  const topScorer = topScorers[0];

  el("summaryBox").innerHTML = `
    <h1>🏆 시즌 ${state.season} 종료</h1>
    <p class="sub-hint">우승: <strong style="color:var(--accent);">${champion}</strong></p>
    <p class="sub-hint">${teamName(state.userTeamId)}의 최종 순위: <strong>${rank}위</strong> (승점 ${state.standings[state.userTeamId].pts})</p>
    ${topScorer ? `<p class="sub-hint">득점왕: <strong>${topScorer.name}</strong> (${topScorer.goals}골)</p>` : ""}
    <button class="primary-btn" id="nextSeasonBtn">다음 시즌 시작</button>
  `;
  el("nextSeasonBtn").onclick = startNextSeason;
}

function startNextSeason() {
  state.season++;
  state.round = 0;
  state.over = false;
  state.standings = freshStandings(state.teams);
  state.teams.forEach(t => {
    t.starGoals = 0;
    t.attack = clampNum(t.attack + rand(-4, 4), 45, 92);
    t.defense = clampNum(t.defense + rand(-4, 4), 45, 92);
  });
  state.squad.forEach(p => { p.goals = 0; p.apps = 0; p.stamina = 100; p.injuredRounds = 0; });
  state.fixtures = generateRoundRobin(state.teams.map(t => t.id));
  state.transferMarket = makeTransferBatch(new Set(state.usedNames));
  autoFillLineup();
  state.screen = "lineup";
  addNews(`시즌 ${state.season} 개막!`, true);
  render();
}

}
function closeTransfer() {
  el("transferOverlay").classList.add("hidden");
}
function renderTransferList() {
  el("tabBuyBtn").classList.toggle("active", state.activeTransferTab === "buy");
  el("tabSellBtn").classList.toggle("active", state.activeTransferTab === "sell");
  const box = el("transferList");
  if (state.activeTransferTab === "buy") {
    box.innerHTML = state.transferMarket.map(p => {
      const cost = estimateValue(p);
      const canAfford = state.budget >= cost && state.squad.length < SQUAD_MAX;
      return `
        <div class="player-row">
          <div class="p-info">
            <span class="p-name">${p.name} (${POSITION_LABEL[p.pos]})</span>
            <span class="p-meta">능력 ${p.rating} · 가격 ${cost}억</span>
          </div>
          <button class="ghost-btn buy-btn" data-id="${p.id}" ${canAfford ? "" : "disabled"}>영입</button>
        </div>
      `;
    }).join("") || '<p class="sub-hint">이번 라운드에는 매물이 없습니다.</p>';
    box.querySelectorAll(".buy-btn").forEach(btn => btn.addEventListener("click", () => buyPlayer(btn.dataset.id)));
  } else {
    box.innerHTML = state.squad.map(p => {
      const value = Math.round(estimateValue(p) * 0.7);
      const remainingInPos = state.squad.filter(x => x.pos === p.pos && x.id !== p.id).length;
      const canSell = remainingInPos >= FORMATION[p.pos];
      return `
        <div class="player-row">
          <div class="p-info">
            <span class="p-name">${p.name} (${POSITION_LABEL[p.pos]})</span>
            <span class="p-meta">능력 ${p.rating} · 판매가 ${value}억</span>
          </div>
          <button class="ghost-btn sell-btn" data-id="${p.id}" ${canSell ? "" : "disabled"}>방출</button>
        </div>
      `;
    }).join("");
    box.querySelectorAll(".sell-btn").forEach(btn => btn.addEventListener("click", () => sellPlayer(parseInt(btn.dataset.id))));
  }
}

/* ---------------- Boot ---------------- */

function renderClubPickList() {
  const list = el("clubPickList");
  list.innerHTML = TEAM_NAMES.map((name, idx) => `
    <div class="club-pick" data-idx="${idx}">
      <div class="cp-name">${name}</div>
      <div class="cp-rating">중위권 전력으로 시작</div>
    </div>
  `).join("");
  let selected = null;
  list.querySelectorAll(".club-pick").forEach(cp => {
    cp.addEventListener("click", () => {
      list.querySelectorAll(".club-pick").forEach(x => x.classList.remove("selected"));
      cp.classList.add("selected");
      selected = parseInt(cp.dataset.idx);
      el("startSeasonBtn").disabled = false;
      el("startSeasonBtn").onclick = () => {
        startNewCareer(selected);
        el("startOverlay").classList.add("hidden");
        render();
      };
    });
  });
}

function initBoot() {
  renderClubPickList();
  el("tabTableBtn").addEventListener("click", () => { state.activeTableTab = "table"; render(); });
  el("tabScorersBtn").addEventListener("click", () => { state.activeTableTab = "scorers"; render(); });
  el("openTransferBtn").addEventListener("click", openTransfer);
  el("closeTransferBtn").addEventListener("click", closeTransfer);
  el("tabBuyBtn").addEventListener("click", () => { state.activeTransferTab = "buy"; renderTransferList(); });
  el("tabSellBtn").addEventListener("click", () => { state.activeTransferTab = "sell"; renderTransferList(); });
}

initBoot();
</script>
</body>
</html>
