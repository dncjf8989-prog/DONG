<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>스도쿠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* 레이아웃: 가운데 정렬된 한 열. 위에 상태 줄, 가운데 판, 아래에 조작 버튼과 숫자 패드. */
:root{
  --bg:#eef1f7; --surface:#ffffff; --ink:#16213a; --muted:#5f6b85;
  --line:#ccd3e3; --box:#16213a;
  --accent:#3454d1; --accent-ink:#ffffff; --accent-soft:#e1e8ff;
  --peer:#eaeef9; --same:#d3defc; --sel:#b4c8ff;
  --user:#3454d1; --hint:#0a7d63; --err:#c2255c; --err-soft:#ffe1ea;
  --btn:#e4e9f5; --btn-ink:#16213a; --shadow:0 1px 2px rgba(22,33,58,.08),0 8px 24px rgba(22,33,58,.08);
  --font-ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-num:"Inter","Noto Sans KR",system-ui,sans-serif;
  --font-head:"Space Grotesk","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1424; --surface:#161e33; --ink:#e7ecf8; --muted:#97a3c0;
    --line:#2b3654; --box:#aab6d6;
    --accent:#8aa4ff; --accent-ink:#0e1424; --accent-soft:#23305a;
    --peer:#1c2641; --same:#2b3b72; --sel:#3a4f94;
    --user:#8fa8ff; --hint:#4fd1b0; --err:#ff7aa5; --err-soft:#43202f;
    --btn:#222d4a; --btn-ink:#e7ecf8; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1424; --surface:#161e33; --ink:#e7ecf8; --muted:#97a3c0;
  --line:#2b3654; --box:#aab6d6;
  --accent:#8aa4ff; --accent-ink:#0e1424; --accent-soft:#23305a;
  --peer:#1c2641; --same:#2b3b72; --sel:#3a4f94;
  --user:#8fa8ff; --hint:#4fd1b0; --err:#ff7aa5; --err-soft:#43202f;
  --btn:#222d4a; --btn-ink:#e7ecf8; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);
  padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* 상단 */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font:700 26px/1 var(--font-head);letter-spacing:-.01em}
.sub{font-size:12px;color:var(--muted);margin-top:6px}
.stats{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.stat b{font:600 18px/1 var(--font-num)}
.stat span{font-size:11px;color:var(--muted)}

/* 난이도 */
.levels{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;min-height:34px}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill.daily{margin-left:auto}
.pill:focus-visible,.key:focus-visible,.tool:focus-visible,.link:focus-visible,.cell:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 판 */
.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);
  background:var(--surface);border:2px solid var(--box);border-radius:6px;box-shadow:var(--shadow);overflow:hidden;user-select:none;touch-action:manipulation}
.cell{position:relative;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  font:500 clamp(18px,6.2vw,30px)/1 var(--font-num);font-variant-numeric:tabular-nums;cursor:pointer;min-width:0;min-height:0}
.cell.c3{border-right:2px solid var(--box)} .cell.c8{border-right:0}
.cell.r3{border-bottom:2px solid var(--box)} .cell.r8{border-bottom:0}
.cell.peer{background:var(--peer)} .cell.same{background:var(--same)} .cell.sel{background:var(--sel)}
.cell.given{font-weight:600;color:var(--ink)} .cell.user{color:var(--user)} .cell.hint{color:var(--hint)}
.cell.err{color:var(--err);background:var(--err-soft)}
.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  font:500 clamp(8px,2.4vw,12px)/1 var(--font-num);color:var(--muted);pointer-events:none}
.notes i{font-style:normal;display:flex;align-items:center;justify-content:center}
.notes i.on{color:var(--accent)}

/* 조작 */
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tool{border:0;border-radius:12px;background:var(--btn);color:var(--btn-ink);padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;min-height:56px}
.tool svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool:disabled{opacity:.45;cursor:default}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.key{border:0;border-radius:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 0 6px;min-height:58px;font:600 clamp(18px,5.6vw,26px)/1 var(--font-num);min-width:0}
.key small{font:400 10px/1 var(--font-num);color:var(--muted)}
.key:disabled{opacity:.3;cursor:default}
.key.notes-on{border-color:var(--accent);color:var(--accent)}
.foot{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px;color:var(--muted)}
.link{background:none;border:0;padding:6px 0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:34px}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.best{margin-left:auto;font-variant-numeric:tabular-nums}

/* 완료 */
.win{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(10,14,28,.55);z-index:20}
.win[hidden]{display:none}
.card{background:var(--surface);border-radius:16px;padding:24px;max-width:340px;width:100%;box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;gap:14px}
.card h2{margin:0;font:700 24px/1.1 var(--font-head)}
.card dl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0}
.card dt{font-size:11px;color:var(--muted)} .card dd{margin:2px 0 0;font:600 18px/1.2 var(--font-num);font-variant-numeric:tabular-nums}
.card .rec{font-size:13px;color:var(--hint);min-height:18px}
.card .row{display:flex;gap:8px}
.card .row button{flex:1;border:0;border-radius:10px;padding:12px;cursor:pointer;background:var(--btn);color:var(--btn-ink);font-weight:500;min-height:44px}
.card .row button.primary{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.gen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,14,28,.35);z-index:25;color:#fff;font-size:15px}
.gen[hidden]{display:none}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
@media (max-width:380px){ .tool{font-size:11px} .stats{gap:12px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>스도쿠</h1><div class="sub" id="sub">새 게임</div></div>
    <div class="stats">
      <div class="stat"><b id="timer">00:00</b><span>시간</span></div>
      <div class="stat"><b id="mist">0</b><span>실수</span></div>
    </div>
  </div>

  <div class="levels" id="levels" role="group" aria-label="난이도">
    <button class="pill" data-lv="easy" aria-pressed="false">쉬움</button>
    <button class="pill" data-lv="normal" aria-pressed="true">보통</button>
    <button class="pill" data-lv="hard" aria-pressed="false">어려움</button>
    <button class="pill" data-lv="expert" aria-pressed="false">전문가</button>
    <button class="pill daily" id="daily" aria-pressed="false">오늘의 퍼즐</button>
  </div>

  <div class="board" id="board" role="grid" aria-label="스도쿠 판"></div>

  <div class="tools">
    <button class="tool" id="undo" aria-label="되돌리기"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>되돌리기</button>
    <button class="tool" id="erase" aria-label="지우기"><svg viewBox="0 0 24 24"><path d="m7 21-4-4 11-11 7 7-8 8z"/><path d="M13 21h8"/></svg>지우기</button>
    <button class="tool" id="notes" aria-pressed="false" aria-label="메모 모드"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>메모 <span id="notesState">끔</span></span></button>
    <button class="tool" id="autonote" aria-label="자동 메모"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 8h.01M12 8h.01M16 8h.01M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01"/></svg>자동 메모</button>
    <button class="tool" id="hint" aria-label="힌트"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg><span>힌트 <span id="hintCount">0</span></span></button>
  </div>

  <div class="pad" id="pad"></div>

  <div class="foot">
    <button class="link" id="newgame">새 게임</button>
    <label class="chk"><input type="checkbox" id="showErr" checked> 실수 바로 표시</label>
    <span class="best" id="best"></span>
  </div>
</div>

<div class="win" id="win" hidden role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="card">
    <h2 id="winTitle">완성했습니다</h2>
    <dl><div><dt>시간</dt><dd id="wTime">-</dd></div><div><dt>실수</dt><dd id="wMist">-</dd></div><div><dt>힌트</dt><dd id="wHint">-</dd></div></dl>
    <div class="rec" id="wRec"></div>
    <div class="row"><button id="wClose">판 보기</button><button class="primary" id="wNew">새 게임</button></div>
  </div>
</div>
<div class="gen" id="gen" hidden>퍼즐을 만드는 중…</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const LV = { easy:{n:'쉬움',clues:40}, normal:{n:'보통',clues:33}, hard:{n:'어려움',clues:28}, expert:{n:'전문가',clues:24} };
const KEY = 'sudoku.game.v1', BEST = 'sudoku.best.v1', DAILY = 'sudoku.daily.v1';

/* ---------- 칸 정보 ---------- */
const R = [], C = [], B = [], PEERS = [];
for (let i = 0; i < 81; i++) { R[i] = Math.floor(i / 9); C[i] = i % 9; B[i] = Math.floor(R[i] / 3) * 3 + Math.floor(C[i] / 3); }
for (let i = 0; i < 81; i++) { const s = []; for (let j = 0; j < 81; j++) if (j !== i && (R[j] === R[i] || C[j] === C[i] || B[j] === B[i])) s.push(j); PEERS[i] = s; }
const POP = new Uint8Array(512); for (let i = 1; i < 512; i++) POP[i] = POP[i >> 1] + (i & 1);

/* ---------- 난수 (오늘의 퍼즐은 날짜로 고정) ---------- */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function seedOf(str){ let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return h >>> 0; }
function shuffle(a, rnd){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- 풀이기: 해의 개수를 센다 (가장 후보가 적은 칸부터) ---------- */
function solve(start, rnd, limit){
  const g = start.slice(), rows = new Array(9).fill(0), cols = new Array(9).fill(0), boxes = new Array(9).fill(0);
  for (let i = 0; i < 81; i++) if (g[i]) { const b = 1 << (g[i] - 1); rows[R[i]] |= b; cols[C[i]] |= b; boxes[B[i]] |= b; }
  let count = 0, first = null;
  (function rec(){
    let best = -1, bestMask = 0, bestN = 10;
    for (let i = 0; i < 81; i++) {
      if (g[i]) continue;
      const m = ~(rows[R[i]] | cols[C[i]] | boxes[B[i]]) & 511, n = POP[m];
      if (n < bestN) { best = i; bestMask = m; bestN = n; if (n <= 1) break; }
    }
    if (best < 0) { count++; if (!first) first = g.slice(); return count >= limit; }
    if (bestN === 0) return false;
    const ds = []; for (let d = 0; d < 9; d++) if (bestMask & (1 << d)) ds.push(d);
    if (rnd) shuffle(ds, rnd);
    for (const d of ds) {
      const b = 1 << d; g[best] = d + 1; rows[R[best]] |= b; cols[C[best]] |= b; boxes[B[best]] |= b;
      if (rec()) return true;
      rows[R[best]] &= ~b; cols[C[best]] &= ~b; boxes[B[best]] &= ~b;
    }
    g[best] = 0; return false;
  })();
  return { count, sol: first };
}
function makePuzzle(level, rnd){
  const full = solve(new Array(81).fill(0), rnd, 1).sol, g = full.slice(), target = LV[level].clues;
  let clues = 81;
  for (const i of shuffle([...Array(81).keys()], rnd)) {
    if (clues <= target) break;
    const keep = g[i]; g[i] = 0;
    if (solve(g, null, 2).count !== 1) g[i] = keep; else clues--;
  }
  return { puzzle: g, solution: full };
}

/* ---------- 상태 ---------- */
let S = null;   // {level, daily, date, puzzle, sol, val, notes, hintCells, sel, noteMode, mistakes, hints, secs, done, showErr}
let undoStack = [], lastTs = Date.now();

function blank(level, daily, date, p){
  return { level, daily, date, puzzle:p.puzzle, sol:p.solution, val:p.puzzle.slice(), notes:new Array(81).fill(0),
    hintCells:new Array(81).fill(false), sel:-1, noteMode:false, mistakes:0, hints:0, secs:0, done:false };
}
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function store(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function load(k){ try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function save(){ if (S) store(KEY, S); }

function newGame(level, daily){
  const date = todayStr();
  const rnd = daily ? mulberry32(seedOf('sudoku-daily-' + date)) : mulberry32((Math.random() * 4294967296) >>> 0);
  const lv = daily ? 'normal' : level;
  $('#gen').hidden = false;
  setTimeout(() => {   // 생성 중 표시가 먼저 그려지도록 한 틱 미룸
    const p = makePuzzle(lv, rnd);
    S = blank(lv, daily, date, p); S.showErr = $('#showErr').checked;
    undoStack = []; lastTs = Date.now(); $('#win').hidden = true; $('#gen').hidden = true;
    save(); buildAll(); selectFirst();
  }, 20);
}
function selectFirst(){ const i = S.val.findIndex(v => !v); S.sel = i < 0 ? 0 : i; render(); }

/* ---------- 판 그리기 ---------- */
const cells = [];
function buildBoard(){
  const b = $('#board'); b.innerHTML = ''; cells.length = 0;
  for (let i = 0; i < 81; i++) {
    const el = document.createElement('div');
    el.className = 'cell' + (C[i] % 3 === 2 && C[i] < 8 ? ' c3' : '') + (C[i] === 8 ? ' c8' : '') + (R[i] % 3 === 2 && R[i] < 8 ? ' r3' : '') + (R[i] === 8 ? ' r8' : '');
    el.setAttribute('role', 'gridcell'); el.tabIndex = -1; el.dataset.i = i;
    b.appendChild(el); cells.push(el);
  }
}
function buildPad(){
  const p = $('#pad'); p.innerHTML = '';
  for (let d = 1; d <= 9; d++) {
    const k = document.createElement('button'); k.className = 'key'; k.dataset.d = d; k.setAttribute('aria-label', d + ' 입력');
    k.innerHTML = d + '<small></small>'; p.appendChild(k);
  }
}
function buildAll(){ buildBoard(); buildPad(); document.querySelectorAll('.pill[data-lv]').forEach(b => b.setAttribute('aria-pressed', String(!S.daily && b.dataset.lv === S.level))); $('#daily').setAttribute('aria-pressed', String(!!S.daily)); render(); }

function fmt(s){ const m = Math.floor(s / 60), r = s % 60; return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0'); }
function render(){
  if (!S) return;
  const sv = S.sel >= 0 ? S.val[S.sel] : 0, peers = S.sel >= 0 ? new Set(PEERS[S.sel]) : null, counts = new Array(10).fill(0);
  for (let i = 0; i < 81; i++) {
    const el = cells[i], v = S.val[i]; let cls = el.className.replace(/ (peer|same|sel|given|user|hint|err)\b/g, '');
    if (v && S.sol[i] === v) counts[v]++;
    if (i === S.sel) cls += ' sel'; else if (sv && v === sv) cls += ' same'; else if (peers && peers.has(i)) cls += ' peer';
    if (S.puzzle[i]) cls += ' given'; else if (v) { cls += S.hintCells[i] ? ' hint' : ' user'; if (S.showErr && v !== S.sol[i]) cls += ' err'; }
    el.className = cls;
    if (v) { if (el.firstChild == null || el.firstChild.nodeType !== 3 || el.firstChild.nodeValue !== String(v)) el.textContent = v; }
    else if (S.notes[i]) {
      let h = '<span class="notes">'; for (let d = 1; d <= 9; d++) h += '<i' + (sv === d ? ' class="on"' : '') + '>' + ((S.notes[i] >> (d - 1)) & 1 ? d : '') + '</i>'; el.innerHTML = h + '</span>';
    } else el.textContent = '';
    el.setAttribute('aria-label', (R[i] + 1) + '행 ' + (C[i] + 1) + '열 ' + (v ? v : '빈 칸'));
  }
  document.querySelectorAll('.key').forEach(k => { const d = +k.dataset.d, left = 9 - counts[d]; k.disabled = left <= 0 || S.done; k.querySelector('small').textContent = left > 0 ? left : '✓'; k.classList.toggle('notes-on', S.noteMode); });
  $('#mist').textContent = S.mistakes; $('#timer').textContent = fmt(S.secs); $('#hintCount').textContent = S.hints;
  $('#notes').setAttribute('aria-pressed', String(S.noteMode)); $('#notesState').textContent = S.noteMode ? '켬' : '끔';
  $('#undo').disabled = !undoStack.length;
  $('#sub').textContent = S.daily ? '오늘의 퍼즐 · ' + S.date : LV[S.level].n + ' · 숫자 ' + S.puzzle.filter(Boolean).length + '개로 시작';
  const best = (load(BEST) || {})[S.level]; $('#best').textContent = !S.daily && best ? LV[S.level].n + ' 최고 ' + fmt(best) : '';
}

/* ---------- 조작 ---------- */
function snap(){ undoStack.push({ val:S.val.slice(), notes:S.notes.slice(), hc:S.hintCells.slice(), hints:S.hints }); if (undoStack.length > 300) undoStack.shift(); }
function editable(i){ return i >= 0 && !S.puzzle[i] && !S.hintCells[i] && !S.done; }
function place(d){
  const i = S.sel; if (!editable(i)) { if (i >= 0 && !S.done) toast(S.puzzle[i] ? '처음부터 있던 숫자입니다' : '힌트로 채운 칸입니다'); return; }
  if (S.noteMode) { if (S.val[i]) return; snap(); S.notes[i] ^= 1 << (d - 1); }
  else {
    if (S.val[i] === d) return;
    snap(); S.val[i] = d; S.notes[i] = 0;
    for (const j of PEERS[i]) S.notes[j] &= ~(1 << (d - 1));
    if (d !== S.sol[i]) S.mistakes++;
    if (S.val.every((v, k) => v === S.sol[k])) return finish();
  }
  save(); render();
}
function erase(){ const i = S.sel; if (!editable(i) || (!S.val[i] && !S.notes[i])) return; snap(); S.val[i] = 0; S.notes[i] = 0; save(); render(); }
function undo(){ const u = undoStack.pop(); if (!u) return; S.val = u.val; S.notes = u.notes; S.hintCells = u.hc; S.hints = u.hints; save(); render(); }
function hint(){
  if (S.done) return;
  let i = S.sel;
  if (!(i >= 0 && !S.puzzle[i] && S.val[i] !== S.sol[i])) {
    const open = []; for (let k = 0; k < 81; k++) if (!S.puzzle[k] && S.val[k] !== S.sol[k]) open.push(k);
    if (!open.length) return; i = open[Math.floor(Math.random() * open.length)]; S.sel = i;
  }
  snap(); S.val[i] = S.sol[i]; S.notes[i] = 0; S.hintCells[i] = true; S.hints++;
  for (const j of PEERS[i]) S.notes[j] &= ~(1 << (S.sol[i] - 1));
  toast(R[i] + 1 + '행 ' + (C[i] + 1) + '열에 ' + S.sol[i] + ' (힌트)');
  if (S.val.every((v, k) => v === S.sol[k])) return finish();
  save(); render();
}
function autoNotes(){
  if (S.done) return; snap();
  for (let i = 0; i < 81; i++) {
    if (S.val[i]) { S.notes[i] = 0; continue; }
    let used = 0; for (const j of PEERS[i]) if (S.val[j]) used |= 1 << (S.val[j] - 1);
    S.notes[i] = ~used & 511;
  }
  save(); render(); toast('후보 숫자를 모두 채웠습니다');
}
function move(dr, dc){ if (S.sel < 0) { S.sel = 0; render(); return; } const r = Math.max(0, Math.min(8, R[S.sel] + dr)), c = Math.max(0, Math.min(8, C[S.sel] + dc)); S.sel = r * 9 + c; render(); }

/* ---------- 완료 ---------- */
function finish(){
  S.done = true; save(); render();
  const best = load(BEST) || {}; let rec = '';
  if (!S.hints) {
    if (S.daily) { const dl = load(DAILY) || {}; dl[S.date] = S.secs; store(DAILY, dl); rec = '오늘의 퍼즐 완료'; }
    else if (!best[S.level] || S.secs < best[S.level]) { best[S.level] = S.secs; store(BEST, best); rec = '새 최고 기록입니다'; }
  } else rec = '힌트를 쓰면 기록되지 않습니다';
  $('#wTime').textContent = fmt(S.secs); $('#wMist').textContent = S.mistakes; $('#wHint').textContent = S.hints; $('#wRec').textContent = rec;
  setTimeout(() => { $('#win').hidden = false; $('#wNew').focus(); }, 350); render();
}

/* ---------- 알림 / 타이머 ---------- */
let toastT = 0;
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1800); }
setInterval(() => {
  const now = Date.now(), dt = now - lastTs; lastTs = now;
  if (!S || S.done || document.hidden) return;
  if (dt > 0 && dt < 5000) { S._ms = (S._ms || 0) + dt; while (S._ms >= 1000) { S._ms -= 1000; S.secs++; } $('#timer').textContent = fmt(S.secs); if (S.secs % 5 === 0) save(); }
}, 250);
document.addEventListener('visibilitychange', () => { lastTs = Date.now(); if (document.hidden) save(); });

/* ---------- 이벤트 ---------- */
$('#board').addEventListener('pointerdown', e => { const c = e.target.closest('.cell'); if (!c || !S) return; S.sel = +c.dataset.i; render(); });
$('#pad').addEventListener('click', e => { const k = e.target.closest('.key'); if (k && !k.disabled) place(+k.dataset.d); });
$('#erase').onclick = erase; $('#undo').onclick = undo; $('#hint').onclick = hint; $('#autonote').onclick = autoNotes;
$('#notes').onclick = () => { S.noteMode = !S.noteMode; save(); render(); };
$('#showErr').onchange = e => { S.showErr = e.target.checked; save(); render(); };
document.querySelectorAll('.pill[data-lv]').forEach(b => b.onclick = () => newGame(b.dataset.lv, false));
$('#daily').onclick = () => newGame('normal', true);
$('#newgame').onclick = () => newGame(S.daily ? 'normal' : S.level, false);
$('#wNew').onclick = () => newGame(S.daily ? 'normal' : S.level, false);
$('#wClose').onclick = () => { $('#win').hidden = true; };
document.addEventListener('keydown', e => {
  if (!S || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k >= '1' && k <= '9') { place(+k); e.preventDefault(); }
  else if (k === 'Backspace' || k === 'Delete' || k === '0') { erase(); e.preventDefault(); }
  else if (k === 'ArrowUp') { move(-1, 0); e.preventDefault(); } else if (k === 'ArrowDown') { move(1, 0); e.preventDefault(); }
  else if (k === 'ArrowLeft') { move(0, -1); e.preventDefault(); } else if (k === 'ArrowRight') { move(0, 1); e.preventDefault(); }
  else if (k === 'n' || k === 'N' || k === 'ㅜ') { S.noteMode = !S.noteMode; render(); }
  else if (k === 'h' || k === 'H') hint();
  else if ((e.ctrlKey && (k === 'z' || k === 'Z')) || k === 'u' || k === 'U') { undo(); e.preventDefault(); }
});

/* ---------- 시작: 저장된 판이 있으면 이어서 ---------- */
(function start(){
  buildBoard(); buildPad();
  const sv = load(KEY);
  if (sv && sv.puzzle && sv.sol && sv.val && sv.val.length === 81) { S = sv; $('#showErr').checked = S.showErr !== false; buildAll(); if (S.sel < 0) selectFirst(); }
  else newGame('normal', false);
})();
})();
</script>
</body>
